<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 23rd, Charlie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#4A9BE0;
    --sky-bottom:#BEE3F8;
    --water1:#2E5FA3;
    --water2:#3B78CB;
    --water3:#5B9BE0;
    --panel:#C6C6C6;
    --panel-light:#FFFFFF;
    --panel-dark:#555555;
    --panel-darker:#373737;
    --wood:#8B5A2B;
    --wood-dark:#5E3A1A;
    --gold:#F0C419;
    --ink:#2b2b2b;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    height:100%;
    overflow:hidden;
    font-family:'VT323', monospace;
    image-rendering:pixelated;
  }
  .px{ image-rendering:pixelated; image-rendering:crisp-edges; }

  .scene{
    position:relative;
    width:100vw;
    height:100vh;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-top) 38%, var(--sky-bottom) 55%);
    overflow:hidden;
  }

  /* ---------- sun ---------- */
  .sun-glow{
    position:absolute;
    top:6%; right:10%;
    width:180px; height:180px;
    background:radial-gradient(circle, rgba(255,241,118,0.55) 0%, rgba(255,241,118,0) 70%);
    pointer-events:none;
  }
  .sun{
    position:absolute;
    top:9%; right:15%;
    width:64px;
    animation: sunspin 8s steps(4) infinite;
  }
  @keyframes sunspin{
    0%{ filter:brightness(1); }
    50%{ filter:brightness(1.12); }
    100%{ filter:brightness(1); }
  }

  /* ---------- clouds ---------- */
  .cloud{
    position:absolute;
    pointer-events:none;
  }
  .cloud--1{ top:12%; width:140px; animation: cloudmove 42s linear infinite; }
  .cloud--2{ top:20%; width:100px; animation: cloudmove 60s linear infinite; animation-delay:-10s; }
  .cloud--3{ top:8%;  width:120px; animation: cloudmove 50s linear infinite; animation-delay:-28s; }
  @keyframes cloudmove{
    from{ left:-20%; }
    to{ left:120%; }
  }

  /* ---------- grass banks (top decorative strip corners) ---------- */
  .grass-strip{
    position:absolute;
    top:0; left:0; right:0;
    height:16px;
    background-image:url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAbklEQVR4nGOMmWnwn4GBgUFBhZ+BgYGB4cGdjwyk8JkYKASMNXvt/1NiAMUuYIH5iWwD9A/+psgAkr3w4NVXhgevvmIagC5BLGAhVYOCGDd2A9AliAVEhQE+71GeDohRhM97WF1ASozQxgukxAgAWqsprV7/gQMAAAAASUVORK5CYII=');
    background-size:16px 16px;
    background-repeat:repeat-x;
    opacity:0;
  }

  /* ---------- water ---------- */
  .water{
    position:absolute;
    left:0; right:0; bottom:0;
    top:48%;
    background:
      repeating-linear-gradient(180deg, var(--water2) 0px, var(--water2) 16px, var(--water1) 16px, var(--water1) 32px);
  }
  .water::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:16px;
    background:repeating-linear-gradient(90deg, var(--water3) 0 16px, var(--water2) 16px 32px);
    animation: wavecrawl 2.4s steps(8) infinite;
  }
  @keyframes wavecrawl{
    from{ background-position-x:0px; }
    to{ background-position-x:32px; }
  }
  .water-sparkle{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    background-image:
      radial-gradient(2px 2px at 10% 30%, rgba(255,255,255,0.5) 0, transparent 60%),
      radial-gradient(2px 2px at 30% 60%, rgba(255,255,255,0.35) 0, transparent 60%),
      radial-gradient(2px 2px at 55% 20%, rgba(255,255,255,0.45) 0, transparent 60%),
      radial-gradient(2px 2px at 75% 50%, rgba(255,255,255,0.35) 0, transparent 60%),
      radial-gradient(2px 2px at 90% 35%, rgba(255,255,255,0.4) 0, transparent 60%);
    animation: sparkle 1.8s steps(2) infinite alternate;
    pointer-events:none;
  }
  @keyframes sparkle{
    from{ opacity:0.3; }
    to{ opacity:0.8; }
  }

  /* ---------- title ---------- */
  .hero{
    position:relative;
    z-index:5;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    text-align:center;
    padding-top:9vh;
    transition:opacity 0.6s ease, transform 0.6s ease;
  }
  .title-line1{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(0.85rem, 3.2vw, 1.3rem);
    color:#fff;
    text-shadow:3px 3px 0 rgba(0,0,0,0.35);
    letter-spacing:1px;
  }
  .title-line2{
    margin-top:14px;
    font-family:'Press Start 2P', monospace;
    font-size:clamp(1.4rem, 6vw, 2.6rem);
    color:var(--gold);
    text-shadow:4px 4px 0 rgba(0,0,0,0.35);
    letter-spacing:1px;
  }
  .subtext{
    margin-top:18px;
    font-family:'VT323', monospace;
    font-size:1.4rem;
    color:#fff;
    text-shadow:2px 2px 0 rgba(0,0,0,0.3);
    max-width:32ch;
  }

  .mc-btn{
    margin-top:30px;
    font-family:'Press Start 2P', monospace;
    font-size:0.85rem;
    color:#fff;
    text-shadow:2px 2px 0 rgba(0,0,0,0.5);
    background:#6b6b6b;
    border:none;
    padding:16px 26px;
    cursor:pointer;
    box-shadow:
      inset 4px 4px 0 rgba(255,255,255,0.35),
      inset -4px -4px 0 rgba(0,0,0,0.45),
      0 0 0 4px #1c1c1c;
    transition:transform 0.1s ease, background 0.15s ease;
  }
  .mc-btn:hover{ background:#7a8a5a; }
  .mc-btn:active{ transform:translateY(3px); box-shadow:
      inset 3px 3px 0 rgba(255,255,255,0.3),
      inset -3px -3px 0 rgba(0,0,0,0.45),
      0 0 0 4px #1c1c1c; }
  .mc-btn:focus-visible{ outline:2px solid #fff; outline-offset:4px; }

  .hint{
    margin-top:12px;
    font-family:'VT323', monospace;
    font-size:1.1rem;
    color:rgba(255,255,255,0.75);
    text-shadow:1px 1px 0 rgba(0,0,0,0.3);
  }

  /* ---------- swimmers ---------- */
  .swimmers{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  .fish{ position:absolute; }
  .fish img{ width:100%; display:block; }
  .fish--a{ top:60%; width:70px; animation: swim-r 15s linear infinite, bobY 1.6s ease-in-out infinite; }
  .fish--b{ top:68%; width:50px; animation: swim-l 12s linear infinite, bobY 1.3s ease-in-out infinite; animation-delay:-3s, -0.4s; }
  .fish--c{ top:56%; width:60px; animation: swim-r 19s linear infinite, bobY 1.9s ease-in-out infinite; animation-delay:-8s, -0.8s; }
  .fish--d{ top:78%; width:44px; animation: swim-l 9s linear infinite, bobY 1.1s ease-in-out infinite; animation-delay:-1.5s, -0.2s; }

  @keyframes swim-r{
    0%{ left:-12%; transform:scaleX(1); }
    49.9%{ transform:scaleX(1); }
    50%{ left:112%; transform:scaleX(1); }
    50.1%{ left:112%; transform:scaleX(-1); }
    100%{ left:-12%; transform:scaleX(-1); }
  }
  @keyframes swim-l{
    0%{ left:112%; transform:scaleX(-1); }
    49.9%{ transform:scaleX(-1); }
    50%{ left:-12%; transform:scaleX(-1); }
    50.1%{ left:-12%; transform:scaleX(1); }
    100%{ left:112%; transform:scaleX(1); }
  }
  @keyframes bobY{
    0%,100%{ margin-top:0px; }
    50%{ margin-top:-8px; }
  }

  .fish-flip{ position:relative; }
  .fish-flip img{ position:absolute; top:0; left:0; }
  .frame-a{ opacity:1; }
  .frame-b{ opacity:0; }
  .fish-flip .frame-a{ animation: showA 0.5s steps(1) infinite; }
  .fish-flip .frame-b{ animation: showB 0.5s steps(1) infinite; }
  @keyframes showA{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
  @keyframes showB{ 0%,49%{opacity:0;} 50%,100%{opacity:1;} }

  .dog-wrap{
    position:absolute;
    top:41%;
    width:170px;
    animation: swim-dog 24s linear infinite;
  }
  @keyframes swim-dog{
    0%{ left:-26%; transform:scaleX(1); }
    49.9%{ transform:scaleX(1); }
    50%{ left:120%; transform:scaleX(1); }
    50.1%{ left:120%; transform:scaleX(-1); }
    100%{ left:-26%; transform:scaleX(-1); }
  }
  .dog-frame{ position:relative; width:100%; animation: bob 1.1s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ margin-top:0px; } 50%{ margin-top:-6px; } }
  .dog-frame img{ position:absolute; top:0; left:0; width:100%; display:block; }
  .dog-frame .frame-a{ animation: showA 0.45s steps(1) infinite; }
  .dog-frame .frame-b{ animation: showB 0.45s steps(1) infinite; }

  .ripple{
    position:absolute; left:4px; top:78%;
    width:60px; height:12px;
    border:2px solid rgba(255,255,255,0.5);
    animation: rippleGrow 1.2s steps(6) infinite;
  }
  @keyframes rippleGrow{
    0%{ opacity:0.8; transform:scale(0.4); }
    100%{ opacity:0; transform:scale(1.6); }
  }

  /* ---------- chest ---------- */
  .chest-zone{
    position:absolute;
    z-index:6;
    bottom:9%;
    left:50%;
    transform:translateX(-50%);
    width:150px;
    text-align:center;
    cursor:pointer;
  }
  .chest-stage{
    position:relative;
    width:150px;
    height:150px;
    margin:0 auto;
    perspective:400px;
  }
  .chest-base{
    position:absolute;
    bottom:0; left:0;
    width:100%;
  }
  .chest-lid{
    position:absolute;
    top:31%; left:0;
    width:100%;
    transform-origin:50% 100%;
    transform:rotateX(0deg);
    transition:transform 0.5s cubic-bezier(.3,1.4,.6,1);
  }
  .scene.opened .chest-lid{ transform:rotateX(-115deg); }
  .chest-glow{
    position:absolute;
    top:20%; left:50%;
    width:70px; height:70px;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,241,118,0.9) 0%, rgba(255,241,118,0) 70%);
    opacity:0;
    transition:opacity 0.4s ease 0.3s;
    pointer-events:none;
  }
  .scene.opened .chest-glow{ opacity:1; }
  .sparkle{
    position:absolute;
    width:14px;
    opacity:0;
    pointer-events:none;
  }
  .scene.opened .sparkle{
    animation: sparkleUp 1.4s steps(4) infinite;
  }
  .sp1{ top:15%; left:20%; animation-delay:0.1s !important; }
  .sp2{ top:10%; left:65%; animation-delay:0.5s !important; }
  .sp3{ top:25%; left:45%; animation-delay:0.9s !important; }
  @keyframes sparkleUp{
    0%{ opacity:0; transform:translateY(0) scale(0.6); }
    20%{ opacity:1; }
    100%{ opacity:0; transform:translateY(-40px) scale(1.1); }
  }

  .chest-label{
    margin-top:10px;
    font-family:'Press Start 2P', monospace;
    font-size:0.62rem;
    color:#fff;
    text-shadow:2px 2px 0 rgba(0,0,0,0.5);
  }
  .scene.opened .chest-zone{ pointer-events:none; }
  .scene.opened .chest-label{ opacity:0; }

  /* ---------- reveal panel (Minecraft GUI style) ---------- */
  .reveal{
    position:fixed; inset:0; z-index:20;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    background:rgba(0,0,0,0);
    pointer-events:none;
    transition:background 0.4s ease;
  }
  .scene.opened .reveal{ background:rgba(0,0,0,0.55); pointer-events:auto; }

  .gui-panel{
    width:min(400px, 92vw);
    max-height:88vh;
    overflow-y:auto;
    background:var(--panel);
    box-shadow:
      inset 4px 4px 0 var(--panel-light),
      inset -4px -4px 0 var(--panel-dark),
      0 0 0 4px var(--panel-darker);
    padding:18px;
    opacity:0;
    transform:scale(0.8) translateY(20px);
    transition:opacity 0.45s ease 0.15s, transform 0.45s cubic-bezier(.2,.9,.3,1.1) 0.15s;
  }
  .scene.opened .gui-panel{ opacity:1; transform:scale(1) translateY(0); }

  .gui-title{
    font-family:'Press Start 2P', monospace;
    font-size:0.8rem;
    color:var(--ink);
    text-align:center;
    margin-bottom:14px;
  }
  .item-slot{
    background:#8b8b8b;
    box-shadow:
      inset 3px 3px 0 rgba(0,0,0,0.35),
      inset -2px -2px 0 rgba(255,255,255,0.2);
    padding:8px;
  }
  .item-slot img{
    width:100%;
    display:block;
    image-rendering:auto;
  }
  .gui-caption{
    margin-top:14px;
    text-align:center;
    font-family:'VT323', monospace;
  }
  .gui-caption h2{
    font-size:1.5rem;
    color:var(--ink);
  }
  .gui-caption p{
    margin-top:6px;
    font-size:1.15rem;
    color:#444;
    line-height:1.35;
  }

  .close-btn{
    display:block;
    margin:16px auto 0;
    font-family:'Press Start 2P', monospace;
    font-size:0.6rem;
    color:#fff;
    text-shadow:1px 1px 0 rgba(0,0,0,0.5);
    background:#6b6b6b;
    border:none;
    padding:10px 18px;
    cursor:pointer;
    box-shadow:
      inset 3px 3px 0 rgba(255,255,255,0.35),
      inset -3px -3px 0 rgba(0,0,0,0.45),
      0 0 0 3px #1c1c1c;
  }
  .close-btn:hover{ background:#8a5a5a; }
  .close-btn:active{ transform:translateY(2px); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; }
  }

  @media (max-width:480px){
    .hero{ padding-top:7vh; }
    .chest-zone{ bottom:7%; }
  }
</style>
</head>

        <p>Hope this reels in a whole new season of great experiences. Love you so much.</p>
      </div>
      <button class="close-btn" id="closeBtn">CLOSE</button>
    </div>
  </div>

</div>

<script>
  const scene = document.getElementById('scene');
  const openBtn = document.getElementById('openBtn');
  const closeBtn = document.getElementById('closeBtn');
  const chestZone = document.getElementById('chestZone');
  const hero = document.getElementById('hero');

  function openGift(){
    scene.classList.add('opened');
  }
  function closeGift(){
    scene.classList.remove('opened');
  }

  openBtn.addEventListener('click', openGift);
  chestZone.addEventListener('click', (e)=>{
    if(e.target === openBtn) return;
    openGift();
  });
  closeBtn.addEventListener('click', closeGift);
</script>
</body>
</html>
